[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "station-ecs-lab"
version = "0.1.0"
description = "SS13-inspired station simulation research built on an ECS, focused on subjective knowledge and emergent crew behavior."
requires-python = ">=3.11"
dependencies = [
    "tcod-ecs==5.5.0",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
